<style>
.u195 {width:100%;max-width:370px;font-size:14px;line-height:1.45;position:relative;--a:#cd5339;--soft:color-mix(in srgb,var(--a) 12%,var(--ux-surface));font-variant-numeric:tabular-nums}
.u195 button{border:1px solid var(--ux-line-2);background:var(--ux-surface);border-radius:9px;padding:9px 12px;min-height:38px;transition:background .2s,transform .3s,color .2s;color:var(--ux-ink)}
.u195 button:active{transform:translateY(1px)}.u195 button:disabled{opacity:.4;cursor:default}.u195 button.primary{background:var(--ux-ink);color:var(--ux-page);border-color:transparent}
.u195 .muted{color:var(--ux-ink-2);font-size:12px}.u195 .eyebrow{font:600 10px/1.2 ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--ux-ink-2)}
.u195 .row{display:flex;align-items:center;justify-content:space-between;gap:8px}.u195 .actions{display:flex;gap:8px;align-items:center;margin-top:16px;flex-wrap:wrap}
.u195 input,.u195 select{max-width:100%;min-width:0;background:var(--ux-surface);color:var(--ux-ink);border:1px solid var(--ux-line-2);border-radius:7px;padding:8px;font:inherit}
.u195 output{font-variant-numeric:tabular-nums}.u195 :focus-visible{outline:2px solid var(--ux-accent);outline-offset:3px}
@media(prefers-reduced-motion:reduce){.u195 *,.u195 *::before,.u195 *::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
.u195 .scene{height:168px;position:relative;background:#d4cbb5;border-radius:11px;overflow:hidden;margin:15px 0 14px;transition:background .4s}.u195 svg{width:100%;height:100%;display:block}.u195 .caption{position:absolute;left:17px;top:17px;font:italic 26px Georgia;color:#2f433a;text-shadow:0 1px 1px #ffffff77}.u195 .timecode{position:absolute;right:12px;bottom:11px;font:10px ui-monospace;color:white;background:#263e34cc;padding:4px 7px;border-radius:3px}.u195 .timeline{display:flex;height:8px;gap:4px;margin:18px 0}.u195 .timeline i{flex:1;background:var(--ux-surface-3);border-radius:2px;transition:background .4s}.u195 .timeline i.on{background:light-dark(#66816a,#b8d1a8)}.u195 .chapters{display:flex;gap:7px}.u195 .chapters button{flex:1;font-size:11px;text-align:left;padding:10px 9px;background:none;border:0;border-top:2px solid var(--ux-line-2);border-radius:0}.u195 .chapters button[aria-pressed=true]{border-color:var(--ux-ink);background:var(--ux-surface)}.u195 .chapters small{display:block;font:9px ui-monospace;color:var(--ux-ink-2);margin-top:6px}.u195 .reset{font-size:11px;border:0;background:none;padding:2px 7px;min-height:28px}

<script>
(()=>{const root=document.currentScript.previousElementSibling;const q=s=>root.querySelector(s),qa=s=>[...root.querySelectorAll(s)];const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;const state=s=>root.dataset.state=s;const pulse=(el,frames,duration=450)=>{if(!reduced)el.animate(frames,{duration,easing:'cubic-bezier(.2,.8,.2,1)'});};const data=[['#d4cbb5','#81947a','#415e4d','Into the forest.','00:00'],['#c3d4dd','#7f98a3','#4a697c','Above the ridge.','02:40'],['#e4b895','#bc7f72','#704c59','A softer ending.','05:30']];function choose(n){const v=data[n];q('.scene').style.background=v[0];q('.far').setAttribute('fill',v[1]);q('.near').setAttribute('fill',v[2]);q('.sun').setAttribute('cy',[45,25,105][n]);q('.caption').textContent=v[3];q('.timecode').textContent=v[4];qa('[data-ch]').forEach((b,i)=>b.setAttribute('aria-pressed',n===i));state('chapter-'+n);pulse(q('svg'),[{transform:'scale(1.07)',opacity:.5},{transform:'scale(1)',opacity:1}],600)}qa('[data-ch]').forEach(b=>b.onclick=()=>choose(+b.dataset.ch));})();
