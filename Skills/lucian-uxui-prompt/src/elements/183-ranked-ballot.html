<script>
(()=>{const root=document.currentScript.previousElementSibling;const q=s=>root.querySelector(s),qa=s=>[...root.querySelectorAll(s)];const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;const state=s=>root.dataset.state=s;const pulse=(el,frames,duration=450)=>{if(!reduced)el.animate(frames,{duration,easing:'cubic-bezier(.2,.8,.2,1)'});};let order=['도시 산책','도예 클래스','숲 피크닉'],voted=false;function render(){q('.choices').innerHTML=order.map((x,i)=>'<div class="choice"><span class="rank">'+(i+1)+'</span><b>'+x+'</b><span class="score" '+(voted?'':'hidden')+'>'+(3-i)+'점</span><button class="up" data-i="'+i+'" aria-label="'+x+' 순위 올리기" '+(voted?'hidden':'')+' '+(!i?'disabled':'')+'>↑</button></div>').join('');qa('.up').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(i){[order[i-1],order[i]]=[order[i],order[i-1]];render();qa('.up')[i-1]?.focus();pulse(q('.choices'),[{opacity:.5},{opacity:1}])}});q('.submit').textContent=voted?'✓ 투표됨 · 수정':'투표하기';state('rank-'+order.join('-')+(voted?'-voted':''))}q('.submit').onclick=()=>{voted=!voted;render()};render();})();
