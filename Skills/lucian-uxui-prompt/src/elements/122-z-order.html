<style>
.u122{width:100%;max-width:400px;min-width:0;font-size:13px}.u122 button{font:inherit;color:inherit;cursor:pointer}.u122 input[type=range]{min-width:0;width:100%;accent-color:var(--ux-accent)}.u122 .sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}.u122 .canvas{height:250px;position:relative;background:var(--ux-surface-2);border:1px solid var(--ux-line-2);border-radius:4px}.u122 .shape{position:absolute;width:120px;height:120px;border:2px solid #fff7;border-radius:12px;display:grid;place-items:center;font-size:25px;font-weight:700;color:#fff;box-shadow:0 4px 12px #0002}.u122 .shape[data-id=A]{left:calc(50% - 107px);top:27px;background:#a8886b}.u122 .shape[data-id=B]{left:calc(50% - 25px);top:67px;background:#6f8c81}.u122 .shape[data-id=C]{left:calc(50% - 75px);top:112px;background:#455f55}.u122 .shape[aria-pressed=true]{outline:2px solid var(--ux-accent);outline-offset:3px}
</style>
<div class="ux u122"><div class="canvas" aria-label="레이어 쌓임"><button class="shape" data-id="A" aria-pressed="false">A</button><button class="shape" data-id="B" aria-pressed="true">B</button><button class="shape" data-id="C" aria-pressed="false">C</button></div><output class="sr" aria-live="polite"></output></div>
<script>
(()=>{const root=document.currentScript.previousElementSibling,q=s=>root.querySelector(s),qa=s=>[...root.querySelectorAll(s)];let order=['A','B','C'],selected='B';function paint(){qa('.shape').forEach(b=>{const i=order.indexOf(b.dataset.id);b.style.zIndex=i+1;b.setAttribute('aria-pressed',b.dataset.id===selected);b.setAttribute('aria-label','레이어 '+b.dataset.id+', '+(i===2?'맨 앞':i===0?'맨 뒤':'중간')+', 누르면 맨 앞으로')});q('output').textContent='앞 '+[...order].reverse().join(' · ')+' 뒤'}function front(id){selected=id;order=order.filter(x=>x!==id).concat(id);paint()}qa('.shape').forEach(b=>{b.onclick=()=>front(b.dataset.id);b.onkeydown=e=>{if(e.key==='ArrowDown'){e.preventDefault();selected=b.dataset.id;order=[selected,...order.filter(x=>x!==selected)];paint()}if(e.key==='ArrowUp'){e.preventDefault();front(b.dataset.id)}if(e.key==='Escape'){order=['A','B','C'];selected='B';paint()}}});paint();})();
</script>
