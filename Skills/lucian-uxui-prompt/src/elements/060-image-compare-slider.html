<style>
.u060{--x:50%;position:relative;width:330px;height:460px;border-radius:30px;overflow:hidden;isolation:isolate;cursor:ew-resize;user-select:none;-webkit-user-select:none;touch-action:pan-y;box-shadow:0 30px 60px -32px rgba(10,10,40,.55)}
.u060:focus-visible{outline:2px solid var(--ux-accent);outline-offset:4px}
.u060-l{position:absolute;inset:0}
.u060-l svg{width:100%;height:100%;display:block}
.u060-night{clip-path:inset(0 0 0 var(--x))}
.u060-line{position:absolute;top:0;bottom:0;left:var(--x);width:2px;margin-left:-1px;background:rgba(255,255,255,.95);box-shadow:0 0 16px rgba(0,0,0,.35);z-index:2}
.u060-hd{position:absolute;top:50%;left:var(--x);width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:rgba(255,255,255,.95);color:#16151B;box-shadow:0 12px 26px -8px rgba(0,0,0,.55);display:grid;place-items:center;z-index:3;transition:transform .4s var(--ux-spring),width .3s,height .3s}
.u060:hover .u060-hd{transform:scale(1.06)}
.u060.drag .u060-hd{transform:scale(1.18)}
.u060-hd svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s var(--ux-spring)}
.u060.drag .u060-hd svg{transform:scaleX(1.25)}
.u060-tag{position:absolute;top:18px;z-index:4;height:30px;padding:0 12px;border-radius:999px;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;transition:opacity .3s}
.u060-tag svg{width:14px;height:14px}
.u060-tag.d{left:16px;background:rgba(255,255,255,.75);color:#7A4A0F}
.u060-tag.n{right:16px;background:rgba(14,12,40,.6);color:#E6E2FF}
.u060-tag.fade{opacity:0}
.u060-cap{position:absolute;left:18px;right:18px;bottom:18px;z-index:4;display:flex;justify-content:space-between;align-items:flex-end;color:#fff;text-shadow:0 1px 10px rgba(0,0,0,.35);pointer-events:none}
.u060-cap b{font-size:20px;font-weight:850;letter-spacing:-.04em}
.u060-cap small{display:block;font-size:12px;font-weight:700;opacity:.85}
.u060-cap em{font-style:normal;font-size:13px;font-weight:800;font-variant-numeric:tabular-nums}
</style>
<div class="ux u060" tabindex="0" role="slider" aria-label="낮과 밤 비교, 밤 쪽 비율" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50">

  <span class="u060-tag n" aria-hidden="true"><svg viewBox="0 0 14 14"><path d="M10.5 9A4.5 4.5 0 0 1 5 3.5 4.5 4.5 0 1 0 10.5 9z" fill="currentColor"/></svg>밤 10:00</span>
  <div class="u060-cap" aria-hidden="true"><span><small>서울 · 한강변</small><b>같은 자리, 다른 시간</b></span><em>낮 50 · 밤 50</em></div>
</div>
<script>
(function () {
  var root = document.currentScript.previousElementSibling;
  var tagD = root.querySelector('.u060-tag.d'), tagN = root.querySelector('.u060-tag.n'), pctEl = root.querySelector('.u060-cap em');
  var rm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var uid = 'u060' + Math.random().toString(36).slice(2, 7);
  // 같은 건물 배치로 낮 장면과 밤 장면을 그립니다. 밤에는 창문 일부에만 불이 켜집니다
  var B = [[0, 250, 54], [48, 210, 40], [84, 270, 62], [140, 190, 46], [180, 240, 58], [232, 160, 44], [270, 220, 64]];
  function scene(night) {
    var g = uid + (night ? 'n' : 'd'), out = '<svg viewBox="0 0 330 460" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="' + g + '" x1="0" y1="0" x2="0" y2="1">' +
      (night ? '<stop offset="0" stop-color="#0E0B2E"/><stop offset=".6" stop-color="#2B1F5E"/><stop offset="1" stop-color="#5A3A7A"/>' : '<stop offset="0" stop-color="#8CC8FF"/><stop offset=".65" stop-color="#CFE7FF"/><stop offset="1" stop-color="#FFE2C2"/>') +
      '</linearGradient></defs><rect width="330" height="460" fill="url(#' + g + ')"/>';
    if (night) {
      for (var s = 0; s < 26; s++) out += '<circle cx="' + ((s * 73) % 330) + '" cy="' + ((s * 41) % 200 + 10) + '" r="' + (s % 3 ? 1 : 1.6) + '" fill="#fff" opacity="' + (0.4 + (s % 4) * 0.15) + '"/>';
      out += '<circle cx="250" cy="96" r="30" fill="#F2EEFF"/><circle cx="238" cy="88" r="27" fill="#1A1440"/>';
    } else {
      out += '<circle cx="250" cy="96" r="34" fill="#FFD27A"/><circle cx="250" cy="96" r="56" fill="#FFD27A" opacity=".25"/>';
      out += '<ellipse cx="80" cy="120" rx="46" ry="14" fill="#fff" opacity=".8"/><ellipse cx="110" cy="112" rx="30" ry="12" fill="#fff" opacity=".8"/>';
    }
    B.forEach(function (b, i) {
      var x = b[0], top = 460 - 120 - b[1], w = b[2];
      out += '<rect x="' + x + '" y="' + top + '" width="' + w + '" height="' + (b[1] + 120) + '" fill="' + (night ? (i % 2 ? '#1E1A3E' : '#251F4A') : (i % 2 ? '#B9C6D8' : '#D3DCE8')) + '"/>';
      for (var r = top + 14; r < 330; r += 18) for (var c = x + 8; c < x + w - 8; c += 14) {
        var lit = ((r * 7 + c * 3 + i * 11) % 9) < 4;
        out += '<rect x="' + c + '" y="' + r + '" width="7" height="9" rx="1" fill="' + (night ? (lit ? '#FFD27A' : '#2E2860') : '#8FB2D9') + '"' + (night && lit ? ' opacity=".95"' : ' opacity=".7"') + '/>';
      }
    });
    out += '<rect y="330" width="330" height="130" fill="' + (night ? '#141030' : '#5E9BC9') + '"/>';
    for (var k = 0; k < 7; k++) out += '<rect x="' + (k * 50 + (night ? 10 : 0)) + '" y="' + (350 + k * 13) + '" width="' + (30 + k * 4) + '" height="2" rx="1" fill="' + (night ? '#FFD27A' : '#fff') + '" opacity="' + (night ? .5 : .55) + '"/>';
    return out + '</svg>';
  }
  root.querySelector('.u060-day').innerHTML = scene(false);
  root.querySelector('.u060-night').innerHTML = scene(true);
  var x = 50, raf = 0, drag = false, moved = false;
  function set(v) {
    x = Math.max(0, Math.min(100, v));
    root.style.setProperty('--x', x.toFixed(2) + '%');
    root.setAttribute('aria-valuenow', Math.round(100 - x));
    root.setAttribute('aria-valuetext', '밤 ' + Math.round(100 - x) + '%');
    pctEl.textContent = '낮 ' + Math.round(x) + ' · 밤 ' + (100 - Math.round(x));
    tagD.classList.toggle('fade', x < 30);
    tagN.classList.toggle('fade', x > 70);
  }
  // 누른 곳까지는 스프링으로 따라가 경계가 툭 튀지 않게 합니다
  function glide(to) {
    cancelAnimationFrame(raf);
    if (rm) { set(to); return; }
    var v = 0;
    (function step() {
      if (!root.isConnected) return;
      var a = (to - x) * 0.14 - v * 0.38; v += a; set(x + v);
      if (Math.abs(to - x) > 0.05 || Math.abs(v) > 0.05) raf = requestAnimationFrame(step); else set(to);
    })();
  }
  function pctAt(e) { var r = root.getBoundingClientRect(); return (e.clientX - r.left) / r.width * 100; }
  root.addEventListener('pointerdown', function (e) {
    if (e.button !== 0) return;
    drag = true; moved = false;
    root.setPointerCapture(e.pointerId);
    root.classList.add('drag');
    glide(pctAt(e));
  });
  root.addEventListener('pointermove', function (e) {
    if (!drag) return;
    moved = true; cancelAnimationFrame(raf); set(pctAt(e));
  });
  function up() { drag = false; root.classList.remove('drag'); }
  root.addEventListener('pointerup', up);
  root.addEventListener('pointercancel', up);
  root.addEventListener('dblclick', function () { glide(50); });
  root.addEventListener('keydown', function (e) {
    var d = e.key === 'ArrowRight' ? 5 : e.key === 'ArrowLeft' ? -5 : 0;
    if (e.key === 'Home') { e.preventDefault(); glide(0); return; }
    if (e.key === 'End') { e.preventDefault(); glide(100); return; }
    if (d) { e.preventDefault(); glide(x + d); }
  });
  set(50);
})();
</script>
