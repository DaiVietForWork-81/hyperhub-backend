<!-- @meta {"title": "픽셀 아이콘 작업대", "category": "공간·일정·디자인 도구", "summary": "8×8 칸에 픽셀을 찍어 작은 아이콘을 그리는 작업대입니다. 빈 칸을 누르면 칠해지고 칠한 칸을 누르면 지워지며, 끌면 지나간 칸이 한 번에 바뀝니다.", "hint": "칸을 누르거나 끌어서 칠해 보세요. Esc를 누르면 처음 그림으로 돌아갑니다", "shape": "square", "fluid": true, "hue": "#8A55C9", "hue2": "#3D8BFF", "tags": ["pixel-editor", "native", "spatial"]} -->
<!-- @demo [["wait", 500], ["drag", ".u113 .pixel", 1, [0.5, 0.5], [5.6, 0.5], 900], ["wait", 700], ["tap", ".u113 .pixel", 27], ["wait", 900], ["key", ".u113 .pixel", 0, "Escape", 1, 1000]] -->
<!-- @en {"title": "Pixel icon workbench", "summary": "A workbench for drawing a small icon on an 8×8 grid. Press an empty cell to fill it or a filled one to erase it; drag to change every cell you pass over.", "hint": "Press or drag across cells to paint. Esc restores the original drawing","map":[
  ["8 × 8 픽셀 아이콘", "8 × 8 pixel icon"],
  ["${Math.floor(i/8)+1}행 ${i%8+1}열", "row ${Math.floor(i/8)+1}, column ${i%8+1}"]
]} -->
<style>
.u113{width:100%;max-width:400px;min-width:0;font-size:13px}.u113 button{font:inherit;color:inherit;cursor:pointer}.u113 input[type=range]{min-width:0;width:100%;accent-color:var(--ux-accent)}.u113 .sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}.u113{max-width:264px;padding:4px}.u113 .pixels{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;aspect-ratio:1;padding:2px;background:var(--ux-line-2);border:5px solid var(--ux-surface);box-shadow:0 5px 18px var(--ux-shadow)}.u113 .pixel{border:0;border-radius:0;padding:0;min-height:0;aspect-ratio:1;background:var(--ux-surface);touch-action:none}.u113 .pixel[aria-pressed=true]{background:var(--ux-accent)}
</style>
<div class="ux u113"><div class="pixels" aria-label="8 × 8 픽셀 아이콘"></div></div>
<script>
(()=>{const root=document.currentScript.previousElementSibling,q=s=>root.querySelector(s),qa=s=>[...root.querySelectorAll(s)];const initial=[10,11,12,13,17,22,25,30,33,38,41,46,50,51,52,53];let pixels=new Set(initial),drag=false,draw=true;q('.pixels').innerHTML=Array.from({length:64},(_,i)=>`<button class="pixel" data-i="${i}" aria-label="${Math.floor(i/8)+1}행 ${i%8+1}열" aria-pressed="false"></button>`).join('');function paint(){qa('.pixel').forEach(b=>b.setAttribute('aria-pressed',pixels.has(+b.dataset.i)))}function dot(b){if(!b)return;draw?pixels.add(+b.dataset.i):pixels.delete(+b.dataset.i);paint()}qa('.pixel').forEach(b=>{b.onpointerdown=e=>{draw=!pixels.has(+b.dataset.i);drag=true;b.setPointerCapture(e.pointerId);dot(b)};b.onpointermove=e=>{if(drag&&b.hasPointerCapture(e.pointerId)){const el=document.elementFromPoint(e.clientX,e.clientY);if(el?.classList.contains('pixel'))dot(el)}};b.onpointerup=()=>drag=false;b.onpointercancel=()=>drag=false;b.onclick=e=>{if(e.detail===0){draw=!pixels.has(+b.dataset.i);dot(b)}}});root.onkeydown=e=>{if(e.key==='Escape'){pixels=new Set(initial);paint()}};paint();})();
</script>
