<style>.u170{width:100%;max-width:390px;padding:16px;position:relative;font-size:13px;line-height:1.45}.u170 button{border:1px solid var(--ux-line-2);background:var(--ux-surface);padding:8px 12px;border-radius:10px;min-height:44px;font-size:12px;transition:background .2s,transform .3s var(--ux-ease)}.u170 button[aria-pressed="true"]{background:var(--ux-accent-soft);border-color:var(--ux-accent)}.u170 button:active{transform:scale(.97)}.u170 small{color:var(--ux-ink-2);font-size:12px}.u170 .status{margin-top:10px;color:var(--ux-ink-2);font-size:12px;line-height:1.5}.u170 .status b{color:var(--ux-ink)}.u170 .controls{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.u170 svg{display:block;width:100%;overflow:visible}.u170 svg text{font-family:inherit;fill:var(--ux-ink-2);font-size:11px}.u170 .gridline{stroke:var(--ux-line-2);fill:none}.u170 input[type="range"]{width:100%;height:44px;accent-color:var(--ux-accent);margin:0}.u170 .inline{display:flex;align-items:center;justify-content:space-between;gap:12px}

<script>
(()=>{const root=document.currentScript.previousElementSibling;const q=s=>root.querySelector(s),qa=s=>[...root.querySelectorAll(s)];const d=[[4,'감지','응답 지연 감지'],[16,'확인','DB 연결 풀 포화'],[24,'완화','대기열 제한 적용'],[36,'회복','지연 정상 수준'],[49,'종료','모든 지표 정상']];let zoom=false,k=-1;q('.timeline').innerHTML=d.map((x,i)=>`<button class="incident" data-k="${i}" aria-label="09:${String(x[0]).padStart(2,'0')} ${x[1]}"><b>${['!','⌕','↓','✓','·'][i]}</b><small>${x[1]}</small></button>`).join('');function draw(){const lo=zoom?10:0,hi=zoom?40:60;qa('.incident').forEach((b,i)=>{b.hidden=d[i][0]<lo||d[i][0]>hi;b.style.setProperty('--left',`calc(${(d[i][0]-lo)/(hi-lo)*100}% - 22px)`);b.setAttribute('aria-pressed',i===k)});q('.start').textContent=zoom?'09:10':'09:00';q('.end').textContent=zoom?'09:40':'10:00';q('.zoom').setAttribute('aria-pressed',zoom);q('.zoom').textContent=zoom?'축소 −':'확대 +';q('.status').innerHTML=k<0?`${zoom?'09:10–09:40':'감지 → 회복 · 32분'}`:`<b>09:${String(d[k][0]).padStart(2,'0')} ${d[k][1]}</b> · ${d[k][2]}`;root.dataset.state=zoom+':'+k}q('.zoom').onclick=()=>{zoom=!zoom;k=-1;draw()};qa('.incident').forEach((b,i)=>b.onclick=()=>{k=i;draw()});draw();})();
</script>
