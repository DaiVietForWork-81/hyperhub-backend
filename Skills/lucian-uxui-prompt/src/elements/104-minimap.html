(()=>{const root=document.currentScript.previousElementSibling,q=s=>root.querySelector(s),qa=s=>[...root.querySelectorAll(s)];let x=100,y=70;function paint(){x=Math.max(0,Math.min(600-q(".canvas").clientWidth,x));y=Math.max(0,Math.min(400-q(".canvas").clientHeight,y));root.style.setProperty("--x",-x+"px");root.style.setProperty("--y",-y+"px");const m=q(".mini"),v=q(".viewport");v.style.left=x/600*m.clientWidth+"px";v.style.top=y/400*m.clientHeight+"px";v.style.width=q(".canvas").clientWidth/600*m.clientWidth+"px";v.style.height=q(".canvas").clientHeight/400*m.clientHeight+"px";q("output").textContent="위치 "+x+", "+y}function point(e){const r=q(".mini").getBoundingClientRect();x=Math.round((e.clientX-r.left)/r.width*600-q(".canvas").clientWidth/2);y=Math.round((e.clientY-r.top)/r.height*400-q(".canvas").clientHeight/2);paint()}q(".mini").onpointerdown=e=>{e.currentTarget.setPointerCapture(e.pointerId);point(e)};q(".mini").onpointermove=e=>{if(e.currentTarget.hasPointerCapture(e.pointerId))point(e)};q(".mini").onkeydown=e=>{const d={ArrowLeft:[-40,0],ArrowRight:[40,0],ArrowUp:[0,-40],ArrowDown:[0,40]}[e.key];if(d){e.preventDefault();x+=d[0];y+=d[1];paint()}if(e.key==="Escape"||e.key==="Home"){e.preventDefault();x=100;y=70;paint()}};new ResizeObserver(paint).observe(q(".canvas"));paint();})();
