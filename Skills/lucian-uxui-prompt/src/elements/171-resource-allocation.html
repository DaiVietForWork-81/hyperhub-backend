<style>.u171{width:100%;max-width:390px;padding:16px;position:relative;font-size:13px;line-height:1.45}.u171 button{border:1px solid var(--ux-line-2);background:var(--ux-surface);padding:8px 12px;border-radius:10px;min-height:44px;font-size:12px;transition:background .2s,transform .3s var(--ux-ease)}.u171 button[aria-pressed="true"]{background:var(--ux-accent-soft);border-color:var(--ux-accent)}.u171 button:active{transform:scale(.97)}.u171 small{color:var(--ux-ink-2);font-size:12px}.u171 .status{margin-top:10px;color:var(--ux-ink-2);font-size:12px;line-height:1.5}.u171 .status b{color:var(--ux-ink)}.u171 .controls{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.u171 svg{display:block;width:100%;overflow:visible}.u171 svg text{font-family:inherit;fill:var(--ux-ink-2);font-size:11px}.u171 .gridline{stroke:var(--ux-line-2);fill:none}.u171 input[type="range"]{width:100%;height:44px;accent-color:var(--ux-accent);margin:0}.u171 .inline{display:flex;align-items:center;justify-content:space-between;gap:12px}.u171 .pool{display:flex;height:60px;border-radius:9px;background:var(--ux-surface-3);overflow:hidden;margin:24px 0 16px}.u171 .pool i{width:calc(var(--n)/12*100%);background:var(--c);transition:width .5s var(--ux-ease)}.u171 .teams{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.u171 .team{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;color:var(--ux-ink-2)}.u171 input{width:68px;height:44px;border:1px solid var(--ux-line-2);background:var(--ux-surface);border-radius:8px;padding:8px;text-align:center;font-size:18px;color:var(--ux-ink)}.u171 .status{text-align:center}.u171{min-height:0;box-shadow:none}.u171 .status{background:transparent;border:0;padding:0;min-height:0;height:auto}.u171 .inline{margin-bottom:8px}</style>
<div class="ux u171"><div class="pool" aria-label="총 12코어의 자원 배분"></div><div class="teams"></div><div class="status" aria-live="polite"></div></div>
<script>
(()=>{const root=document.currentScript.previousElementSibling,q=s=>root.querySelector(s),names=['리서치','프로덕트','플랫폼'],colors=['#426F90','#6285A2','#8BA2B3'];let vals=[4,3,2];q('.teams').innerHTML=names.map((n,i)=>`<label class="team"><span>${n}</span><input type="number" min="0" max="12" step="1" value="${vals[i]}" data-k="${i}" aria-label="${n} 코어 수"></label>`).join('');q('.pool').innerHTML=vals.map((v,i)=>`<i style="--n:${v};--c:${colors[i]}"></i>`).join('');function draw(){let total=vals.reduce((a,b)=>a+b,0);root.querySelectorAll('.pool i').forEach((el,i)=>{el.style.setProperty('--n',vals[i])});root.querySelectorAll('input').forEach((el,i)=>{el.value=vals[i];el.max=12-total+vals[i]});q('.status').textContent=`${total}/12코어 · 남은 용량 ${12-total}코어`;root.dataset.state=vals.join(',')}q('.teams').oninput=e=>{let el=e.target;if(el.tagName!=='INPUT')return;let i=+el.dataset.k,remaining=12-vals.reduce((sum,v,j)=>sum+(j===i?0:v),0);vals[i]=Math.max(0,Math.min(remaining,Math.round(+el.value||0)));draw()};draw()})();
</script>
