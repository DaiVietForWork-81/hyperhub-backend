<script>
(function () {
  var root = document.currentScript.previousElementSibling;
  var uid = 'u096' + Math.random().toString(36).slice(2, 7);
  var q = function (s) { return root.querySelector(s); };
  var price = q('.u096-p'), dB = q('.u096-d b'), dS = q('.u096-d span'), ch = q('.u096-ch'), tag = q('.u096-tag');
  var base = q('.u096-base'), line = q('.u096-line'), area = q('.u096-area'), ref = q('.u096-ref'), cur = q('.u096-cur'), dot = q('.u096-dot'), ring = q('.u096-ring'), ev = q('.u096-ev');
  var rect = q('.u096-cp rect'), rg = q('.u096-rg'), btns = rg.querySelectorAll('button');
  var rm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  q('.u096-gd').id = uid + 'g'; q('.u096-cp').id = uid + 'c';
  area.setAttribute('fill', 'url(#' + uid + 'g)');
  q('.u096-clip').setAttribute('clip-path', 'url(#' + uid + 'c)');
  var N = 61, W = 340, H = 236, PT = 34, PB = 14;
  function rnd(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; var t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  // 시작값과 끝값을 고정한 무작위 걸음으로 그럴듯한 가격 흐름을 만듭니다
  function series(seed, a, b, vol) {
    var r = rnd(seed), w = [0];
    for (var i = 1; i < N; i++) w.push(w[i - 1] + (r() - 0.5) * vol);
    return w.map(function (v, i) { var t = i / (N - 1); return Math.round(a + (b - a) * t + v - w[N - 1] * t); });
  }
  var R = [
    { v: series(7, 52300, 53540, 420), lab: function (i) { var m = 9 * 60 + Math.round(i * 6.5); return (m < 720 ? '오전 ' : '오후 ') + (Math.floor(m / 60) % 12 || 12) + ':' + ('0' + m % 60).slice(-2); }, now: '오늘', ev: [20, '거래량 급증'] },
    { v: series(3, 50100, 53540, 700), lab: function (i) { var d = 6 + Math.floor(i / 12.2); return '10월 ' + d + '일'; }, now: '최근 1주', ev: [36, '신제품 발표'] },
    { v: series(11, 57900, 53540, 1100), lab: function (i) { var d = 10 + Math.floor(i / 2); return d > 30 ? '10월 ' + (d - 30) + '일' : '9월 ' + d + '일'; }, now: '최근 1달', ev: [38, '실적 발표'] },
    { v: series(5, 38200, 53540, 2600), lab: function (i) { var m = 10 + Math.floor(i / 5); return (m > 12 ? '2026년 ' + (m - 12) : '2025년 ' + m) + '월'; }, now: '최근 1년', ev: [44, '액면 분할'] }
  ];
  var k = 0, ys = null, at = N - 1, scrub = false, tw = 0, back = 0;
  function proj(v) { var mn = Math.min.apply(null, v), mx = Math.max.apply(null, v), pad = (mx - mn) * 0.12; return v.map(function (x) { return PT + (1 - (x - mn + pad) / (mx - mn + pad * 2)) * (H - PT - PB); }); }
  function X(i) { return i / (N - 1) * (W - 20); }
  function d(y) { return y.map(function (v, i) { return (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + v.toFixed(1); }).join(''); }
  function value(i) { var v = R[k].v, a = Math.floor(i), b = Math.min(N - 1, a + 1); return v[a] + (v[b] - v[a]) * (i - a); }
  function yAt(i) { var a = Math.floor(i), b = Math.min(N - 1, a + 1); return ys[a] + (ys[b] - ys[a]) * (i - a); }
  function paint() {
    var p = d(ys);
    base.setAttribute('d', p); line.setAttribute('d', p);
    area.setAttribute('d', p + 'L' + X(N - 1) + ' ' + H + 'L0 ' + H + 'Z');
    ref.setAttribute('y1', ys[0]); ref.setAttribute('y2', ys[0]);
    var e = R[k].ev[0]; ev.setAttribute('cx', X(e)); ev.setAttribute('cy', ys[e]);
    place();
  }
  // 커서 위치 하나로 선의 색칠 범위, 점, 가격, 증감, 날짜를 함께 갱신합니다
  function place() {
    var x = X(at), y = yAt(at), r = R[k], v = Math.round(value(at)), d0 = v - r.v[0];
    rect.setAttribute('width', x.toFixed(1));
    cur.setAttribute('x1', x); cur.setAttribute('x2', x);
    dot.setAttribute('cx', x); dot.setAttribute('cy', y); ring.setAttribute('cx', x); ring.setAttribute('cy', y);
    root.classList.toggle('dn', d0 < 0);
    price.textContent = '₩' + v.toLocaleString('ko-KR');
    dB.textContent = (d0 >= 0 ? '+' : '−') + '₩' + Math.abs(d0).toLocaleString('ko-KR') + ' (' + (d0 >= 0 ? '+' : '−') + Math.abs(d0 / r.v[0] * 100).toFixed(2) + '%)';
    var near = Math.abs(at - r.ev[0]) <= 1.5;
    dS.textContent = scrub ? r.lab(Math.round(at)) : r.now;
    tag.textContent = near ? r.ev[1] + ' · ' + r.lab(r.ev[0]) : r.lab(Math.round(at));
    var cw = ch.clientWidth, tw2 = tag.offsetWidth, px = x / W * cw;
    tag.style.setProperty('--tx', Math.max(8, Math.min(cw - tw2 - 8, px - tw2 / 2)).toFixed(1) + 'px');
    ch.setAttribute('aria-valuemax', N - 1); ch.setAttribute('aria-valuenow', Math.round(at));
    ch.setAttribute('aria-valuetext', (scrub ? r.lab(Math.round(at)) : r.now) + ' ₩' + v.toLocaleString('ko-KR'));
  }
  function morph(to) {
    cancelAnimationFrame(tw);
    var from = ys ? ys.slice() : to.map(function () { return H - PB; }), t0 = performance.now(), dur = rm ? 1 : 650;
    (function f(n) {
      if (!root.isConnected) return;
      var t = Math.min(1, (n - t0) / dur), e = t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
      ys = from.map(function (y, i) { return y + (to[i] - y) * e; });

      if (t < 1) tw = requestAnimationFrame(f);
    })(t0);
  }
  function goBack() {
    cancelAnimationFrame(back);
    var from = at, t0 = performance.now(), dur = rm ? 1 : 450;
    (function f(n) {
      if (!root.isConnected) return;
      var t = Math.min(1, (n - t0) / dur), e = 1 - Math.pow(1 - t, 3);
      at = from + (N - 1 - from) * e; place();
      if (t < 1) back = requestAnimationFrame(f);
    })(t0);
  }
  function idx(e) { var r = ch.getBoundingClientRect(); return Math.max(0, Math.min(N - 1, (e.clientX - r.left) / r.width * W / (W - 20) * (N - 1))); }
  function start(e) { cancelAnimationFrame(back); scrub = true; root.classList.add('scrub'); at = idx(e); place(); }
  function end() { if (!scrub) return; scrub = false; root.classList.remove('scrub'); goBack(); }
  var touching = false;
  ch.addEventListener('pointerdown', function (e) { if (e.pointerType === 'mouse') return; touching = true; ch.setPointerCapture(e.pointerId); start(e); });
  ch.addEventListener('pointermove', function (e) { if (e.pointerType === 'mouse' || touching) start(e); });
  ch.addEventListener('pointerup', function (e) { if (touching) { touching = false; end(); } });
  ch.addEventListener('pointercancel', function () { touching = false; end(); });
  ch.addEventListener('pointerleave', function (e) { if (e.pointerType === 'mouse') end(); });
  ch.addEventListener('keydown', function (e) {
    var s = { ArrowLeft: -1, ArrowRight: 1 }[e.key];
    if (e.key === 'Escape') return end();
    if (e.key === 'Home') s = -N; else if (e.key === 'End') s = N;
    if (s === undefined) return;
    e.preventDefault(); cancelAnimationFrame(back);
    scrub = true; root.classList.add('scrub');
    at = Math.max(0, Math.min(N - 1, Math.round(at) + s)); place();
  });
  ch.addEventListener('blur', end);
  btns.forEach(function (b, j) {
    b.addEventListener('click', function () {
      if (j === k) return;
      k = j; rg.style.setProperty('--k', j);
      btns.forEach(function (x, i) { x.setAttribute('aria-pressed', String(i === j)); });
      at = N - 1; morph(proj(R[k].v));
    });
  });
  morph(proj(R[0].v));
})();
</script>
