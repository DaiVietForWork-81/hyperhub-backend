<script>
(()=>{const root=document.currentScript.previousElementSibling,$=s=>root.querySelector(s),$$=s=>[...root.querySelectorAll(s)],esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const motion=(node,frames,opts={})=>{if(node?.animate&&!matchMedia('(prefers-reduced-motion:reduce)').matches)node.animate(frames,{duration:220,easing:'cubic-bezier(.2,.8,.2,1)',...opts})};const editor=$('textarea'),history=[];editor.addEventListener('input',()=>history.length=0);function clean(type){history.push(editor.value);let lines=editor.value.split('\n');if(type==='trim')lines=lines.map(x=>x.trim()).filter(Boolean);if(type==='dedup')lines=[...new Set(lines.map(x=>x.trim()).filter(Boolean))];if(type==='sort')lines.sort((a,b)=>a.trim().localeCompare(b.trim(),'ko'));editor.value=lines.join('\n');motion(editor,[{transform:'translateX(3px)'},{transform:'none'}])}$$('button').forEach(b=>b.onclick=()=>clean(b.hasAttribute('data-trim')?'trim':b.hasAttribute('data-dedup')?'dedup':'sort'));root.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&history.length){e.preventDefault();editor.value=history.pop()}});})();
