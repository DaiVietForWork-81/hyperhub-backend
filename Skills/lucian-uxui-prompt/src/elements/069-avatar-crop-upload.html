<style>
.u069{position:relative;width:340px;height:520px;display:flex;flex-direction:column;align-items:center;padding:20px 22px 22px;border-radius:30px;background:var(--ux-surface);box-shadow:0 0 0 1px var(--ux-line),0 30px 60px -36px var(--ux-shadow-strong);overflow:hidden}
.u069-top{display:flex;align-items:center;gap:12px;width:100%}
.u069-me{position:relative;width:52px;height:52px;flex:none;border-radius:50%;overflow:hidden;background:var(--ux-surface-3);display:grid;place-items:center;font-size:19px;font-weight:800;color:var(--ux-ink-3);box-shadow:0 0 0 3px var(--ux-surface),0 0 0 5px var(--ux-accent-soft)}
.u069-me .u069-img{left:50%;top:50%;margin:-140px 0 0 -140px}
.u069-top b{display:block;font-size:16px;font-weight:800;letter-spacing:-.03em}
.u069-top small{display:block;margin-top:2px;font-size:12.5px;font-weight:600;color:var(--ux-ink-3)}
.u069-crop{position:relative;width:280px;height:280px;margin-top:18px;border-radius:24px;overflow:hidden;background:#0D0C14;cursor:grab;touch-action:none;outline:none}
.u069-crop.drag{cursor:grabbing}
.u069-crop:focus-visible{box-shadow:0 0 0 3px var(--ux-accent)}
.u069-img{position:absolute;left:0;top:0;width:280px;height:280px;transition:transform .5s var(--ux-spring)}
.u069-crop.drag .u069-img,.u069-crop.now .u069-img{transition:none}
.u069-img svg{display:block;width:100%;height:100%}
.u069-shade{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle 120px at 50% 50%,transparent 99.3%,rgba(8,6,16,.62) 100%)}
.u069-ring{position:absolute;left:20px;top:20px;width:240px;height:240px;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(255,255,255,.85);pointer-events:none}
.u069-grid{position:absolute;left:20px;top:20px;width:240px;height:240px;border-radius:50%;overflow:hidden;pointer-events:none;opacity:0;transition:opacity .25s;background:linear-gradient(90deg,transparent calc(33.33% - .5px),rgba(255,255,255,.5) calc(33.33% - .5px) calc(33.33% + .5px),transparent calc(33.33% + .5px) calc(66.66% - .5px),rgba(255,255,255,.5) calc(66.66% - .5px) calc(66.66% + .5px),transparent calc(66.66% + .5px)),linear-gradient(0deg,transparent calc(33.33% - .5px),rgba(255,255,255,.5) calc(33.33% - .5px) calc(33.33% + .5px),transparent calc(33.33% + .5px) calc(66.66% - .5px),rgba(255,255,255,.5) calc(66.66% - .5px) calc(66.66% + .5px),transparent calc(66.66% + .5px))}
.u069-crop.drag .u069-grid{opacity:1}
.u069-up{position:absolute;inset:0;display:grid;place-items:center;background:rgba(8,6,16,.5);color:#fff;font-size:13px;font-weight:800;opacity:0;pointer-events:none;transition:opacity .25s}
.u069-crop.busy .u069-up{opacity:1}
.u069-tools{display:flex;align-items:center;gap:10px;width:280px;margin-top:14px}
.u069-tools svg{width:18px;height:18px;flex:none;fill:none;stroke:var(--ux-ink-3);stroke-width:2;stroke-linecap:round}
.u069-z{flex:1;-webkit-appearance:none;appearance:none;height:28px;background:none;cursor:pointer}
.u069-z::-webkit-slider-runnable-track{height:5px;border-radius:3px;background:linear-gradient(90deg,var(--ux-accent) var(--f,0%),var(--ux-surface-3) var(--f,0%))}
.u069-z::-moz-range-track{height:5px;border-radius:3px;background:linear-gradient(90deg,var(--ux-accent) var(--f,0%),var(--ux-surface-3) var(--f,0%))}
.u069-z::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;margin-top:-7.5px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3);transition:transform .25s var(--ux-spring)}
.u069-z::-moz-range-thumb{width:20px;height:20px;border:0;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.u069-z:active::-webkit-slider-thumb{transform:scale(1.2)}
.u069-z:focus-visible{outline:2px solid var(--ux-accent);outline-offset:2px;border-radius:6px}
.u069-rot{width:40px;height:40px;flex:none;border:0;padding:0;border-radius:12px;display:grid;place-items:center;background:var(--ux-surface-2);color:var(--ux-ink);transition:transform .3s var(--ux-spring)}
.u069-rot svg{stroke:currentColor}
.u069-rot:active{transform:scale(.9)}
.u069-rot:focus-visible,.u069-b:focus-visible{outline:2px solid var(--ux-accent);outline-offset:2px}
.u069-acts{display:flex;gap:8px;width:100%;margin-top:auto}
.u069-b{flex:1;height:50px;border:0;border-radius:16px;font-size:14.5px;font-weight:750;transition:transform .3s var(--ux-spring),background-color .3s}
.u069-b:active{transform:scale(.97)}
.u069-b.ghost{background:var(--ux-surface-2);color:var(--ux-ink)}
.u069-b.main{background:var(--ux-ink);color:var(--ux-page)}
.u069-b.main.ok{background:var(--ux-mint);color:var(--ux-accent-ink)}
.u069-fly{position:absolute;width:240px;height:240px;border-radius:50%;overflow:hidden;z-index:5;pointer-events:none}
.u069-fly .u069-img{left:-20px;top:-20px}
</style>
<div class="ux u069">
  <div class="u069-top"><span class="u069-me" aria-hidden="true"></span><span><b>프로필 사진</b><small>원 안에 얼굴이 오도록 맞춰 주세요</small></span></div>
  <div class="u069-crop" tabindex="0" role="application" aria-roledescription="사진 자르기" aria-label="사진 위치 조정. 방향키로 옮기고 더하기 빼기로 확대">
    <div class="u069-img" aria-hidden="true"></div>
    <span class="u069-shade" aria-hidden="true"></span>
    <span class="u069-grid" aria-hidden="true"></span>
    <span class="u069-ring" aria-hidden="true"></span>
    <span class="u069-up" aria-hidden="true">사진 올리는 중…</span>
  </div>
  <div class="u069-tools">
    <svg viewBox="0 0 18 18" aria-hidden="true"><circle cx="8" cy="8" r="5"/><path d="M12 12l4 4M6 8h4"/></svg>
    <input class="u069-z" type="range" min="100" max="300" value="100" aria-label="확대">
    <svg viewBox="0 0 18 18" aria-hidden="true"><circle cx="8" cy="8" r="5"/><path d="M12 12l4 4M6 8h4M8 6v4"/></svg>
    <button class="u069-rot" type="button" aria-label="90도 회전"><svg viewBox="0 0 18 18"><path d="M14.5 9A5.5 5.5 0 1 1 9 3.5h3M10.5 1.5L12.5 3.5 10.5 5.5"/></svg></button>
  </div>
  <div class="u069-acts"><button class="u069-b ghost" type="button">다른 사진</button><button class="u069-b main" type="button">저장</button></div>
</div>
<script>
(function () {
  var root = document.currentScript.previousElementSibling;
  var crop = root.querySelector('.u069-crop'), img = crop.querySelector('.u069-img'), me = root.querySelector('.u069-me');
  var zoom = root.querySelector('.u069-z'), rot = root.querySelector('.u069-rot'), other = root.querySelector('.u069-b.ghost'), save = root.querySelector('.u069-b.main');
  var rm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var uid = 'u069' + Math.random().toString(36).slice(2, 7);
  // 사진 대신 쓰는 그림: 배경 그라데이션 위에 얼굴 모양 원과 어깨를 그립니다
  var PICS = [['#FFB547', '#FF6B8B', '#FFE2C2', '#5B3FD9'], ['#5B8CFF', '#22C3A6', '#F5D0B0', '#1E1B4B'], ['#B04FD0', '#FF7A93', '#FFD9C0', '#2B1B57']];
  function art(c, k) {
    var g = uid + k + Math.random().toString(36).slice(2, 5);
    return '<svg viewBox="0 0 240 240"><defs><linearGradient id="' + g + '" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="' + c[0] + '"/><stop offset="1" stop-color="' + c[1] + '"/></linearGradient></defs><rect width="240" height="240" fill="url(#' + g + ')"/><circle cx="180" cy="50" r="40" fill="#fff" opacity=".25"/><path d="M40 240c6-46 40-70 80-70s74 24 80 70z" fill="' + c[3] + '"/><circle cx="120" cy="112" r="44" fill="' + c[2] + '"/><path d="M76 104c0-30 20-50 46-50s44 18 44 46c-10-14-30-20-46-18-20 2-34 10-44 22z" fill="' + c[3] + '"/><circle cx="104" cy="118" r="4" fill="' + c[3] + '"/><circle cx="136" cy="118" r="4" fill="' + c[3] + '"/><path d="M110 138q10 8 20 0" stroke="' + c[3] + '" stroke-width="3" fill="none" stroke-linecap="round"/></svg>';
  }
  var pic = 0, x = 0, y = 0, z = 1, r = 0;
  function clamp() { var m = (280 * z - 240) / 2; x = Math.max(-m, Math.min(m, x)); y = Math.max(-m, Math.min(m, y)); }
  function tf() { return 'translate(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px) rotate(' + r + 'deg) scale(' + z.toFixed(3) + ')'; }
  function paint() {
    clamp();
    img.style.transform = tf();
    zoom.value = Math.round(z * 100);
    zoom.style.setProperty('--f', ((z - 1) / 2 * 100).toFixed(1) + '%');
    zoom.setAttribute('aria-valuetext', Math.round(z * 100) + '%');
  }
  function setPic(i) { pic = i; img.innerHTML = art(PICS[i], 'c'); }
  // 끄는 동안 3분할 안내선을 보여 주고, 틀을 벗어나지 않게 막습니다
  var sx = 0, sy = 0, ox = 0, oy = 0, down = false;
  crop.addEventListener('pointerdown', function (e) {
    if (e.button !== 0) return;
    down = true; sx = e.clientX; sy = e.clientY; ox = x; oy = y;
    crop.setPointerCapture(e.pointerId); crop.classList.add('drag');
  });
  crop.addEventListener('pointermove', function (e) {
    if (!down) return;
    var k = crop.offsetWidth / crop.getBoundingClientRect().width;
    x = ox + (e.clientX - sx) * k; y = oy + (e.clientY - sy) * k; paint();
  });
  function up() { down = false; crop.classList.remove('drag'); }
  crop.addEventListener('pointerup', up);
  crop.addEventListener('pointercancel', up);
  crop.addEventListener('wheel', function (e) {
    e.preventDefault();
    crop.classList.add('now');
    z = Math.max(1, Math.min(3, z * (e.deltaY < 0 ? 1.06 : 0.94))); paint();
    clearTimeout(crop.t); crop.t = setTimeout(function () { crop.classList.remove('now'); }, 120);
  }, { passive: false });
  crop.addEventListener('keydown', function (e) {
    var k = e.key, s = e.shiftKey ? 20 : 6;
    if (k === 'ArrowLeft') x += s; else if (k === 'ArrowRight') x -= s; else if (k === 'ArrowUp') y += s; else if (k === 'ArrowDown') y -= s;
    else if (k === '+' || k === '=') z = Math.min(3, z + 0.1); else if (k === '-') z = Math.max(1, z - 0.1); else return;
    e.preventDefault(); paint();
  });
  zoom.addEventListener('input', function () { crop.classList.add('now'); z = zoom.value / 100; paint(); });
  zoom.addEventListener('change', function () { crop.classList.remove('now'); });
  rot.addEventListener('click', function () { r += 90; paint(); });
  other.addEventListener('click', function () {
    crop.classList.add('busy');
    setTimeout(function () {
      if (!root.isConnected) return;
      setPic((pic + 1) % PICS.length);
      x = 0; y = 0; z = 1; r = 0; paint();
      crop.classList.remove('busy');
      if (!rm) img.animate([{ opacity: 0, transform: tf() + ' scale(.9)' }, { opacity: 1, transform: tf() }], { duration: 450, easing: 'cubic-bezier(.34,1.4,.64,1)' });
    }, rm ? 0 : 700);
  });
  // 저장하면 잘린 원이 위쪽 프로필 자리로 날아가 들어갑니다
  save.addEventListener('click', function () {
    var apply = function () {
      me.innerHTML = '<div class="u069-img">' + art(PICS[pic], 'm') + '</div>';
      me.firstChild.style.transform = 'scale(' + (52 / 240) + ') ' + tf();
      if (!rm) me.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.15)' }, { transform: 'scale(1)' }], { duration: 420, easing: 'cubic-bezier(.34,1.5,.64,1)' });
      save.classList.add('ok'); save.textContent = '저장했어요';
      setTimeout(function () { if (root.isConnected) { save.classList.remove('ok'); save.textContent = '저장'; } }, 1400);
    };
    if (rm) { apply(); return; }
    var fly = document.createElement('div');
    fly.className = 'u069-fly';
    fly.innerHTML = '<div class="u069-img">' + art(PICS[pic], 'f') + '</div>';
    fly.firstChild.style.transform = tf();
    root.appendChild(fly);
    var fx = crop.offsetLeft + 20, fy = crop.offsetTop + 20;
    var tx = me.parentNode.offsetLeft + me.offsetLeft, ty = me.parentNode.offsetTop + me.offsetTop, k = 52 / 240;
    fly.animate([
      { transform: 'translate(' + fx + 'px,' + fy + 'px) scale(1)' },
      { transform: 'translate(' + tx + 'px,' + ty + 'px) scale(' + k + ')' }
    ], { duration: 650, easing: 'cubic-bezier(.6,0,.2,1)', fill: 'forwards' }).onfinish = function () { fly.remove(); apply(); };
    fly.style.left = '0'; fly.style.top = '0'; fly.style.transformOrigin = '0 0';
  });
  setPic(0); paint();
  me.textContent = '서';
})();
</script>
