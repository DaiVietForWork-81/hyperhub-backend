<style>

<div class="ux u199" data-state="initial"><textarea aria-label="체크섬을 비교할 문서" spellcheck="false">LucianLabs / Design with intent.</textarea><div class="hashline"><div class="tiles actual"></div></div><div class="status" aria-live="polite">원문</div></div>
<script>
(()=>{const root=document.currentScript.previousElementSibling;const q=s=>root.querySelector(s),qa=s=>[...root.querySelectorAll(s)];const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;const state=s=>root.dataset.state=s;const pulse=(el,frames,duration=450)=>{if(!reduced)el.animate(frames,{duration,easing:'cubic-bezier(.2,.8,.2,1)'});};const original='LucianLabs / Design with intent.';function hash(s){let h=0x811c9dc5;for(const n of new TextEncoder().encode(s)){h^=n;h=Math.imul(h,0x01000193)}return (h>>>0).toString(16).toUpperCase().padStart(8,'0')}const saved=hash(original);function render(){const current=hash(q('textarea').value),same=current===saved;q('.actual').innerHTML=[...current].map((c,i)=>'<span class="'+(!same&&c!==saved[i]?'mismatch':'')+'">'+c+'</span>').join('');q('.status').textContent=same?'✓ 원문과 일치':'내용이 변경됐습니다';state(same?'match':'mismatch');pulse(q('.actual'),[{opacity:.45},{opacity:1}],250)}q('textarea').oninput=render;render();})();
