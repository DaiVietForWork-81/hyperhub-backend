<script>
(function () {
  var root = document.currentScript.previousElementSibling;
  var go = root.querySelector('.u027-go');
  var input = root.querySelector('.u027-in');
  var x = root.querySelector('.u027-x');
  var list = root.querySelector('.u027-list');
  var uid = 'u027-' + Math.random().toString(36).slice(2, 7);
  list.id = uid;
  input.setAttribute('aria-controls', uid);
  var DATA = [
    ['모션 가이드 2026', '문서', 'linear-gradient(140deg,#8B6CFF,#5B8CFF)'],
    ['색상 팔레트 · 새벽', '컬렉션', 'linear-gradient(140deg,#FF8A65,#FF5A6E)'],
    ['모바일 온보딩 화면', '템플릿', 'linear-gradient(140deg,#22C3A6,#0EA5E9)'],
    ['김서연 · 모션 디자이너', '사람', 'linear-gradient(140deg,#FFC24B,#FF8A3D)'],
    ['색 대비 점검표', '문서', 'linear-gradient(140deg,#A796E8,#6A57F2)'],
    ['결제 화면 키트', '템플릿', 'linear-gradient(140deg,#3D8BFF,#22C3A6)']
  ];
  var shown = [], act = -1;
  function esc(s) { return s.replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); }
  function render() {
    var q = input.value.trim();
    shown = DATA.filter(function (d) { return !q || d[0].indexOf(q) >= 0 || d[1].indexOf(q) >= 0; }).slice(0, 3);
    act = shown.length ? 0 : -1;
    if (!shown.length) { list.innerHTML = '<li class="u027-empty">‘' + esc(q) + '’에 맞는 결과가 없어요</li>'; input.removeAttribute('aria-activedescendant'); return; }
    list.innerHTML = shown.map(function (d, i) {
      var t = esc(d[0]);
      if (q) t = t.split(esc(q)).join('<mark>' + esc(q) + '</mark>');
      return '<li class="u027-opt" role="option" id="' + uid + '-' + i + '" aria-selected="' + (i === act) + '" style="transition-delay:' + (i * 40) + 'ms"><i style="--c:' + d[2] + '" aria-hidden="true"></i><span><b>' + t + '</b><small>' + d[1] + '</small></span></li>';
    }).join('');
    mark();
  }
  function mark() {
    Array.prototype.forEach.call(list.children, function (li, i) { if (li.setAttribute) li.setAttribute('aria-selected', String(i === act)); });
    if (act >= 0) input.setAttribute('aria-activedescendant', uid + '-' + act); else input.removeAttribute('aria-activedescendant');
  }
  function open(focus) {
    root.classList.add('is-open');
    go.setAttribute('aria-expanded', 'true');
    input.setAttribute('aria-expanded', 'true');
    input.tabIndex = 0; x.tabIndex = 0;
    render();
    if (focus !== false) setTimeout(function () { input.focus(); }, 120);
  }
  function close() {
    root.classList.remove('is-open');
    go.setAttribute('aria-expanded', 'false');
    input.setAttribute('aria-expanded', 'false');
    input.tabIndex = -1; x.tabIndex = -1;
    input.value = '';
    go.focus();
  }
  go.addEventListener('click', function () { root.classList.contains('is-open') ? input.focus() : open(); });
  x.addEventListener('click', close);
  input.addEventListener('input', render);
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { e.preventDefault(); close(); }
    if (e.key === 'ArrowDown' && shown.length) { e.preventDefault(); act = (act + 1) % shown.length; mark(); }
    if (e.key === 'ArrowUp' && shown.length) { e.preventDefault(); act = (act - 1 + shown.length) % shown.length; mark(); }
    if (e.key === 'Enter' && act >= 0 && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); input.value = shown[act][0]; render(); }
  });
  list.addEventListener('click', function (e) {
    var li = e.target.closest('.u027-opt');
    if (!li) return;
    var i = Array.prototype.indexOf.call(list.children, li);
    input.value = shown[i][0];
    render();
    input.focus();
  });
  Array.prototype.forEach.call(root.querySelectorAll('.u027-recent button'), function (b) {
    b.addEventListener('click', function () { input.value = b.textContent; render(); input.focus(); });
  });
  Array.prototype.forEach.call(root.querySelectorAll('.u027-nav a'), function (a) {
    a.addEventListener('click', function (e) { e.preventDefault(); });
  });
  // 처음에는 펼친 상태로 보여 줍니다. 닫기(×)를 누르면 돋보기로 접힙니다
  open(false);
})();
</script>
