<style>.u175{width:100%;max-width:390px;padding:16px;position:relative;font-size:13px;line-height:1.45}.u175 button{border:1px solid var(--ux-line-2);background:var(--ux-surface);padding:8px 12px;border-radius:10px;min-height:44px;font-size:12px;transition:background .2s,transform .3s var(--ux-ease)}.u175 button[aria-pressed="true"]{background:var(--ux-accent-soft);border-color:var(--ux-accent)}.u175 button:active{transform:scale(.97)}.u175 small{color:var(--ux-ink-2);font-size:12px}.u175 .status{margin-top:10px;color:var(--ux-ink-2);font-size:12px;line-height:1.5}.u175 .status b{color:var(--ux-ink)}.u175 .controls{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.u175 svg{display:block;width:100%;overflow:visible}.u175 svg text{font-family:inherit;fill:var(--ux-ink-2);font-size:11px}.u175 .gridline{stroke:var(--ux-line-2);fill:none}.u175 input[type="range"]{width:100%;height:44px;accent-color:var(--ux-accent);margin:0}.u175 .inline{display:flex;align-items:center;justify-content:space-between;gap:12px}
.u175{background:transparent;box-shadow:none;border-radius:0;padding:18px}.u175 .legend{display:flex;gap:18px;color:var(--ux-ink-2);font-size:11px;margin-top:10px}.u175 .legend i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;background:var(--c)}.u175 .compare{margin-top:10px}.u175 .metric{margin-bottom:9px}.u175 .metric .title{display:flex;justify-content:space-between;font-size:12px;margin-bottom:11px}.u175 .rail{height:5px;background:var(--ux-surface-3);position:relative;border-radius:4px}.u175 .dot{position:absolute;top:-4px;width:13px;height:13px;border-radius:50%;left:var(--pos);background:var(--c);box-shadow:0 0 0 3px var(--ux-page);transition:left .7s var(--ux-spring);transform:translateX(-50%)}.u175 .metric .values{display:flex;justify-content:space-between;font-size:10px;color:var(--ux-ink-2);margin-top:10px}.u175 .head{margin-bottom:8px}.u175 .status{background:var(--ux-surface);padding:6px;border-radius:8px;height:50px;min-height:50px;font-size:11px}.u175{min-height:0;box-shadow:none}.u175 .status{background:transparent;border:0;padding:0;min-height:0;height:auto}.u175 .inline{margin-bottom:8px}.u175{padding:16px}.u175 .inline{margin-bottom:0;justify-content:space-between}.u175 .norm{border:0;background:var(--ux-surface-3)}.u175 .legend{margin-top:0;font-size:12px}.u175 .metric .title{margin-bottom:10px}.u175 .metric .values{font-size:12px}.u175 .metric{margin-bottom:14px}.u175 .compare{margin-top:14px}</style>
<div class="ux u175"><div class="inline"><div class="legend"><span><i style="--c:#4D83B0"></i>Atlas</span><span><i style="--c:#BE774C"></i>Nova</span></div><button class="norm" aria-pressed="false">척도 맞춤</button></div><div class="compare"></div></div>
<script>
(()=>{const root=document.currentScript.previousElementSibling;const q=s=>root.querySelector(s),qa=s=>[...root.querySelectorAll(s)];const d=[['무게','kg',2.4,1.8,1,3,true],['배터리','h',18,24,10,30,false],['가격','$',129,159,100,200,true]];let normalized=false;q('.compare').innerHTML=d.map((x,i)=>`<div class="metric" data-k="${i}"><div class="title"><b>${x[0]}</b><small>${x[6]?'낮을수록 좋음':'높을수록 좋음'}</small></div><div class="rail"><i class="dot a" style="--c:#4D83B0"></i><i class="dot b" style="--c:#BE774C"></i></div><div class="values"><span class="va"></span><span class="vb"></span></div></div>`).join('');function score(x,v){let s=(v-x[4])/(x[5]-x[4])*100;return Math.round(x[6]?100-s:s)}function draw(){qa('.metric').forEach((row,i)=>{const x=d[i],a=normalized?score(x,x[2]):(x[2]-x[4])/(x[5]-x[4])*100,b=normalized?score(x,x[3]):(x[3]-x[4])/(x[5]-x[4])*100;row.querySelector('.title small').textContent=normalized||!x[6]?'↑':'↓';row.querySelector('.title small').setAttribute('aria-label',normalized||!x[6]?'높을수록 좋음':'낮을수록 좋음');row.querySelector('.a').style.setProperty('--pos',a+'%');row.querySelector('.b').style.setProperty('--pos',b+'%');row.querySelector('.va').textContent=(normalized?score(x,x[2])+'점':(x[1]==='$'?'$'+x[2]:x[2]+x[1]));row.querySelector('.vb').textContent=(normalized?score(x,x[3])+'점':(x[1]==='$'?'$'+x[3]:x[3]+x[1]))});q('.norm').setAttribute('aria-pressed',normalized);q('.norm').textContent=normalized?'0–100 점수':'척도 맞춤';root.dataset.state=String(normalized)}q('.norm').onclick=()=>{normalized=!normalized;draw()};draw();})();
</script>
