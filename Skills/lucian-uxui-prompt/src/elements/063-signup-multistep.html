<div class="ux u063">

<script>
(function () {
  var root = document.currentScript.previousElementSibling;
  var qs = Array.prototype.slice.call(root.querySelectorAll('.u063-q'));
  var bars = root.querySelectorAll('.u063-bar i'), chips = root.querySelector('.u063-chips');
  var form = root.querySelector('.u063-stage'), next = root.querySelector('.u063-next'), done = root.querySelector('.u063-done');
  var meter = root.querySelectorAll('.u063-meter i'), uid = 'u063' + Math.random().toString(36).slice(2, 7);
  var cur = 0, vals = {};
  qs.forEach(function (q, i) {
    var inp = q.querySelector('input'), lab = q.querySelector('label'), msg = q.querySelector('.u063-msg');
    inp.id = uid + i; lab.htmlFor = inp.id; msg.id = uid + 'm' + i; inp.setAttribute('aria-describedby', msg.id);

  root.querySelector('[data-k="pw"]').addEventListener('input', function (e) {

  });

    var v = qs[i].querySelector('input').value.trim();
    if (i === 0 && v.length < 2) return '이름을 두 글자 이상 적어 주세요';
    if (i === 1 && !/^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test(v)) return '이메일 형식이 아니에요 · 예: name@example.com';

    return '';

    qs.forEach(function (q, k) {
      q.classList.toggle('out', k < i);
      q.classList.toggle('wait', k > i);
      q.inert = k !== i;
    });
    cur = i;
    bars.forEach(function (b, k) { b.classList.toggle('on', k < i); });

  }

    chips.innerHTML = '';

      chips.appendChild(c);
    });
  }
  // 답이 맞으면 위 칩으로 접어 올리고 다음 질문을 띄웁니다. 틀리면 입력칸이 흔들리며 이유를 보여 줍니다
  function advance() {
    if (cur > 2) return;
    var q = qs[cur], msg = q.querySelector('.u063-msg'), bad = check(cur), inp = q.querySelector('input');
    if (bad) {
      q.classList.remove('bad'); void q.offsetWidth; q.classList.add('bad');
      msg.textContent = bad; inp.setAttribute('aria-invalid', 'true'); inp.focus({ preventScroll: true });
      return;
    }
    q.classList.remove('bad'); inp.removeAttribute('aria-invalid'); msg.textContent = q.getAttribute('data-hint');
    vals[inp.getAttribute('data-k')] = inp.value.trim();
    show(cur + 1);
    chipsRender();
    if (cur === 3) {
      root.classList.add('is-done');
      done.setAttribute('aria-hidden', 'false');
      root.querySelector('.u063-who').textContent = vals.name + ' 님, ' + vals.mail + '로 인증 메일을 보냈어요';
      next.hidden = true;
    } else next.querySelector('span').textContent = cur === 2 ? '가입하기' : '다음';
  }

  next.addEventListener('click', advance);
  qs.forEach(function (q) { q.querySelector('input').addEventListener('input', function () { if (q.classList.contains('bad')) { q.classList.remove('bad'); q.querySelector('.u063-msg').textContent = q.getAttribute('data-hint'); } }); });
