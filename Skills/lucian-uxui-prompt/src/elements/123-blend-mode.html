<style>
.u123{width:100%;max-width:400px;min-width:0;font-size:13px}.u123 button{font:inherit;color:inherit;cursor:pointer}.u123 input[type=range]{min-width:0;width:100%;accent-color:var(--ux-accent)}.u123 .sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}.u123 .stage{height:215px;position:relative;background:#e9e4da;isolation:isolate;border-radius:100px 5px 5px 5px;overflow:hidden}.u123 .first,.u123 .second{position:absolute;width:150px;height:150px;border-radius:50%;top:33px}.u123 .first{background:#cfa26d;left:calc(50% - 115px)}.u123 .second{background:#698fa4;left:calc(50% - 35px);mix-blend-mode:var(--blend,normal)}.u123 .mode{display:block;width:150px;min-height:44px;margin:18px auto 0;border:1px solid var(--ux-line-2);border-radius:22px;background:var(--ux-surface);font-size:13px;color:var(--ux-ink);padding:8px 13px}
</style>
<div class="ux u123"><div class="stage" aria-label="두 색상 원의 합성"><div class="first"></div><div class="second"></div></div><button class="mode" aria-label="혼합 모드 기본, 누르면 다음 모드">기본 ↻</button></div>
<script>
(()=>{const root=document.currentScript.previousElementSibling,q=s=>root.querySelector(s),qa=s=>[...root.querySelectorAll(s)];const modes=[['normal','기본'],['multiply','곱하기'],['screen','스크린'],['overlay','오버레이'],['difference','차이'],['color','색상']];let i=0;function paint(){root.style.setProperty('--blend',modes[i][0]);q('.mode').textContent=modes[i][1]+' ↻';q('.mode').setAttribute('aria-label','혼합 모드 '+modes[i][1]+', 누르면 다음 모드')}q('.mode').onclick=()=>{i=(i+1)%modes.length;paint()};q('.mode').onkeydown=e=>{if(e.key==='Escape'){i=0;paint()}};})();
</script>
