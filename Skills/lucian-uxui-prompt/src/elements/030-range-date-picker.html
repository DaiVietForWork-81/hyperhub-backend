<style>
.u030{position:relative;width:350px;padding:18px 16px 16px;border-radius:28px;background:var(--ux-surface);box-shadow:0 0 0 1px var(--ux-line),0 36px 70px -40px var(--ux-shadow-strong)}

.u030-view{position:relative;height:276px;overflow:hidden}

.u030-cell.s.e::before{opacity:0}

.u030-cell:nth-child(7n).in::before{border-radius:0 12px 12px 0}
.u030-d{position:relative;width:40px;height:40px;border:0;padding:0;border-radius:50%;background:none;font-size:14.5px;font-weight:620;color:var(--ux-ink);font-variant-numeric:tabular-nums;transition:background-color .2s var(--ux-ease),color .2s,transform .35s var(--ux-spring)}
.u030-d:hover{background:var(--ux-surface-2)}
.u030-d:focus-visible{outline:2px solid var(--ux-accent);outline-offset:1px}
.u030-d.past{color:var(--ux-ink-3);opacity:.45}
.u030-d.today::after{content:"";position:absolute;left:50%;bottom:5px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--ux-accent)}
.u030-cell.s .u030-d,.u030-cell.e .u030-d{background:var(--ux-accent);color:var(--ux-accent-ink);font-weight:760;box-shadow:0 8px 16px -8px color-mix(in srgb,var(--ux-accent) 80%,transparent);animation:u030-pick .4s var(--ux-spring)}
.u030-cell.s .u030-d.today::after,.u030-cell.e .u030-d.today::after{background:var(--ux-accent-ink)}

.u030-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;padding:12px 4px 0;border-top:1px solid var(--ux-line)}

.u030-ok{height:42px;padding:0 18px;border:0;border-radius:13px;background:var(--ux-ink);color:var(--ux-page);font-size:14px;font-weight:700;transition:opacity .3s,transform .35s var(--ux-spring)}

<script>
(function () {
  var root = document.currentScript.previousElementSibling;
  var view = root.querySelector('.u030-view');
  var mEl = root.querySelector('.u030-m');
  var pA = root.querySelector('.u030-a'), pB = root.querySelector('.u030-b');
  var pills = root.querySelectorAll('.u030-pill');
  var sum = root.querySelector('.u030-sum');
  var ok = root.querySelector('.u030-ok');
  var rm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var TODAY = new Date(2026, 9, 10);
  var cur = { y: 2026, m: 9 };
  var start = null, end = null, hover = null, focusKey = null;
  var grid = null;
  var W = ['일', '월', '화', '수', '목', '금', '토'];
  var keyOf = function (d) { return d.getFullYear() * 10000 + d.getMonth() * 100 + d.getDate(); };
  var dateOf = function (k) { return new Date(Math.floor(k / 10000), Math.floor(k / 100) % 100, k % 100); };
  var label = function (k) { var d = dateOf(k); return (d.getMonth() + 1) + '월 ' + d.getDate() + '일 (' + W[d.getDay()] + ')'; };
  // 달 하나를 그립니다. 이후 선택과 호버는 칸을 다시 만들지 않고 클래스만 바꿉니다
  function build(dir) {
    var g = document.createElement('div');
    g.className = 'u030-grid';
    g.setAttribute('role', 'grid');
    var first = new Date(cur.y, cur.m, 1).getDay();
    var n = new Date(cur.y, cur.m + 1, 0).getDate();
    for (var i = 0; i < 42; i++) {
      var c = document.createElement('div');
      c.className = 'u030-cell';
      c.setAttribute('role', 'gridcell');
      var d = i - first + 1;
      if (d >= 1 && d <= n) {
        var dt = new Date(cur.y, cur.m, d), k = keyOf(dt);
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'u030-d';
        b.textContent = d;
        b.dataset.k = k;
        b.tabIndex = -1;
        b.setAttribute('aria-label', label(k));
        if (k < keyOf(TODAY)) { b.classList.add('past'); b.disabled = true; }
        if (k === keyOf(TODAY)) b.classList.add('today');
        c.appendChild(b);
      }
      g.appendChild(c);
    }
    var old = grid;
    grid = g;
    if (old && dir && !rm) {
      g.style.transform = 'translateX(' + (dir * 100) + '%)'; g.style.opacity = '0';
      view.appendChild(g);
      void g.offsetWidth;
      g.style.transform = 'none'; g.style.opacity = '1';
      old.style.transform = 'translateX(' + (-dir * 100) + '%)'; old.style.opacity = '0';
      setTimeout(function () { old.remove(); }, 460);
    } else { if (old) old.remove(); view.appendChild(g); }
    var s = mEl.lastElementChild, ns = document.createElement('span');
    ns.textContent = cur.y + '년 ' + (cur.m + 1) + '월';
    if (dir && !rm) {
      ns.style.transform = 'translateY(' + (dir * 100) + '%)'; ns.style.opacity = '0';
      mEl.appendChild(ns); void ns.offsetWidth;
      ns.style.transform = 'none'; ns.style.opacity = '1';
      s.style.transform = 'translateY(' + (-dir * 100) + '%)'; s.style.opacity = '0';
      setTimeout(function () { s.remove(); }, 460);
    } else { mEl.innerHTML = ''; mEl.appendChild(ns); }
    paint();
    roving();
  }
  function paint() {
    var lo = start, hi = end !== null ? end : (start !== null && hover !== null ? hover : null);
    if (lo !== null && hi !== null && hi < lo) { var t = lo; lo = hi; hi = t; }
    Array.prototype.forEach.call(grid.children, function (c) {
      var b = c.firstChild;
      var k = b ? +b.dataset.k : null;
      c.classList.toggle('s', k !== null && k === (hi === null ? start : lo));
      c.classList.toggle('e', k !== null && hi !== null && k === hi);
      c.classList.toggle('in', k !== null && hi !== null && k >= lo && k <= hi);
      if (b) b.setAttribute('aria-selected', String(k === start || k === end));

  }
  function roving() {
    var btns = Array.prototype.slice.call(grid.querySelectorAll('.u030-d:not(:disabled)'));
    var target = btns.filter(function (b) { return +b.dataset.k === focusKey; })[0] || btns.filter(function (b) { return +b.dataset.k === start; })[0] || btns[0];
    btns.forEach(function (b) { b.tabIndex = b === target ? 0 : -1; });
    return target;
  }
  function summary() {
    pA.textContent = start ? label(start) : '날짜 선택'; pA.classList.toggle('ph', !start);
    pB.textContent = end ? label(end) : '날짜 선택'; pB.classList.toggle('ph', !end);
    pills[0].classList.toggle('on', !start || !!end);
    pills[1].classList.toggle('on', !!start && !end);
    if (start && end) {
      var nights = Math.round((dateOf(end) - dateOf(start)) / 86400000);
      sum.innerHTML = '<b>' + nights + '박</b> · ' + (dateOf(start).getMonth() + 1) + '.' + dateOf(start).getDate() + ' – ' + (dateOf(end).getMonth() + 1) + '.' + dateOf(end).getDate();
    } else sum.textContent = start ? '체크아웃 날짜를 골라 주세요' : '머물 날짜를 골라 주세요';
    ok.setAttribute('aria-disabled', String(!(start && end)));
  }
  function pick(k) {
    if (start === null || end !== null) { start = k; end = null; }
    else if (k === start) { end = null; }
    else { end = Math.max(k, start); start = Math.min(k, start); }
    hover = null;
    focusKey = k;
    paint(); summary(); roving();
  }
  view.addEventListener('click', function (e) { var b = e.target.closest('.u030-d'); if (b && !b.disabled) pick(+b.dataset.k); });
  view.addEventListener('pointerover', function (e) {
    var b = e.target.closest('.u030-d');
    if (b && !b.disabled && start !== null && end === null) { hover = +b.dataset.k; paint(); }
  });
  view.addEventListener('pointerleave', function () { if (hover !== null) { hover = null; paint(); } });
  view.addEventListener('keydown', function (e) {
    var b = e.target.closest('.u030-d');
    if (!b) return;
    var step = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -7, ArrowDown: 7 }[e.key];
    if (!step) return;
    e.preventDefault();
    var d = dateOf(+b.dataset.k); d.setDate(d.getDate() + step);
    if (d < TODAY) return;
    focusKey = keyOf(d);
    if (start !== null && end === null) { hover = focusKey; paint(); }
    if (d.getMonth() !== cur.m) { var dir = d > dateOf(+b.dataset.k) ? 1 : -1; cur = { y: d.getFullYear(), m: d.getMonth() }; build(dir); }
    var t = roving(); if (t) t.focus();
  });
  Array.prototype.forEach.call(root.querySelectorAll('.u030-nav button'), function (b) {
    b.addEventListener('click', function () {
      var s = +b.dataset.step;
      var d = new Date(cur.y, cur.m + s, 1);
      if (d < new Date(TODAY.getFullYear(), TODAY.getMonth(), 1)) return;
      cur = { y: d.getFullYear(), m: d.getMonth() };
      build(s);
    });
  });
  ok.addEventListener('click', function () {
    if (ok.getAttribute('aria-disabled') === 'true') return;
    ok.textContent = '적용됨';
    setTimeout(function () { if (root.isConnected) ok.textContent = '적용'; }, 1400);
  });
  build(0);
  pick(keyOf(new Date(2026, 9, 14)));
  pick(keyOf(new Date(2026, 9, 17)));
  focusKey = null;
})();
</script>
