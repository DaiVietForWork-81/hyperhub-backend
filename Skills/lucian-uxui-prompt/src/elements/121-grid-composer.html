<style>
.u121{width:100%;max-width:400px;min-width:0;font-size:13px}.u121 button{font:inherit;color:inherit;cursor:pointer}.u121 input[type=range]{min-width:0;width:100%;accent-color:var(--ux-accent)}.u121 .sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}.u121{padding:10px 4px}.u121 .grid{display:grid;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));gap:9px;height:210px;border:1px dashed var(--ux-ink-3);padding:12px;background:var(--ux-surface-2)}.u121 .cell{border-radius:4px;background:var(--ux-surface);border:1px solid var(--ux-line-2);min-height:24px}.u121 .cell:nth-child(3n+2){background:var(--ux-accent-soft);border-color:var(--ux-accent)}.u121 label{display:flex;gap:14px;align-items:center;margin-top:22px;color:var(--ux-ink-2)}.u121 input{flex:1;height:26px}.u121 output{font-variant-numeric:tabular-nums;font-size:13px;min-width:14px}
</style>
<div class="ux u121"><div class="grid" aria-label="네 블록의 그리드 배치"><span class="cell"></span><span class="cell"></span><span class="cell"></span><span class="cell"></span></div><label>열<input class="columns" type="range" min="1" max="4" value="3" aria-label="그리드 열 개수"><output aria-live="polite">3</output></label></div>
<script>
(()=>{const root=document.currentScript.previousElementSibling,q=s=>root.querySelector(s),qa=s=>[...root.querySelectorAll(s)];q('.columns').oninput=()=>{root.style.setProperty('--cols',q('.columns').value);q('output').textContent=q('.columns').value};})();
</script>
