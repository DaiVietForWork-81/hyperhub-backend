<script>
(()=>{const root=document.currentScript.previousElementSibling;const q=s=>root.querySelector(s),qa=s=>[...root.querySelectorAll(s)];const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;const state=s=>root.dataset.state=s;const pulse=(el,frames,duration=450)=>{if(!reduced)el.animate(frames,{duration,easing:'cubic-bezier(.2,.8,.2,1)'});};let timer,paired=false;function clear(){clearTimeout(timer);paired=false;root.classList.remove('scanning','found');qa('.device').forEach(b=>{b.tabIndex=-1;b.setAttribute('aria-pressed','false')});q('.scan').disabled=false;q('.scan').textContent='기기 찾기';state('initial')}q('.scan').onclick=()=>{if(paired){clear();return}clear();root.classList.add('scanning');q('.scan').disabled=true;q('.scan').textContent='찾는 중…';state('scanning');timer=setTimeout(()=>{root.classList.remove('scanning');root.classList.add('found');qa('.device').forEach(b=>b.tabIndex=0);q('.scan').disabled=false;q('.scan').textContent='다시 찾기';state('found')},550)};qa('.device').forEach(b=>b.onclick=()=>{paired=true;qa('.device').forEach(x=>x.setAttribute('aria-pressed',x===b));q('.scan').textContent=b.dataset.name+' 연결됨 · 해제';state('paired-'+b.dataset.name)});})();
